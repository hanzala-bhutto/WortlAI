# Tooling config for the WortlAI backend. Not a build system - dependencies live in
# requirements.txt; this file exists so ruff (and any future tool) has one home.
#
# ruff owns both linting and formatting (#47). The rule set is deliberately a
# sensible core, not the kitchen sink: pyflakes + import order, plus bugbear,
# pyupgrade and flake8-simplify. Annotation/docstring families (ANN, D, PL) are left
# off until the baseline is comfortably green.

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: undefined names, unused imports
    "I",   # isort: import ordering
    "B",   # flake8-bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax for our Python floor
    "SIM", # flake8-simplify
]
# The formatter owns line wrapping, so E501 would only nag on lines it can't split
# (long string literals, URLs, prompts). Let those be.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a call in an argument default
# (`db: Session = Depends(get_db)`). That is correct usage, not the B008 bug, so
# allow these framework calls there while B008 still catches real cases.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are autogenerated; don't fight their import order or unused
# imports (the template carries `op`/`sa` whether a revision uses both or not).
"alembic/versions/*" = ["I001", "F401"]
