[pytest]
# Run from backend/: pytest
pythonpath = .
testpaths = tests
asyncio_mode = auto
# Starlette's TestClient (re-exported by FastAPI) warns at import that it uses
# httpx rather than httpx2. It is third-party churn, not our code, and the
# suggested cure (swap the whole project to httpx2) would touch our pinned httpx
# and the provider layer for no gain. Silence just this one so a real warning is
# never lost in the noise.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:
